<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  min-height: 100vh;
  background-image: url("media/bg.png");
  background-size: cover;
}

/* ---------- HEADER ---------- */
header {
  background: transparent;
  color: #ff46A2;
  padding: 1rem 1rem;
}

h1 {
  text-align: center;
  font-size: 3rem;          
  font-weight: 1000;
 -webkit-text-stroke: 3px white;
}


/* ---------- NAV ---------- */
nav {
  text-align: center;
}

nav a {
  color: #ff46A2;
  margin-left: 1rem;
  text-decoration: none;
  font-weight: bold;
  text-transform: uppercase;
  transition: text-shadow 0.2s ease, transform 0.2s ease;
}

nav a:hover {
  text-shadow: 0 0 8px #E86100, 0 0 16px rgba(255, 70, 162, 0.6);
  transform: translateY(-1px);
}

h2 {
  text-align: center;
  font-weight: bold;
}

svg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 8;
}

#cord {
  fill: none;
  stroke: #D30000;
  stroke-width: 6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#phone {
  position: fixed;
  width: 240px;
  cursor: grab;
  user-select: none;
  z-index: 9;
  -webkit-user-drag: none;
  user-drag: none;
}

#phone:active {
  cursor: grabbing;
}

#phonebase {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 250px;
  z-index: 7;
  pointer-events: none;
}

#guy{
  position: fixed;
  left: 0;
  top: 0;
  height: 900px;
}

#guyarm{
  position: fixed;
  left: 0;
  top: 0;
  height: 900px;
}

#earAnchor{
  position:fixed;
  width:10px;
  height:10px;
  pointer-events:none;
}

</style>
</head>
<body>

<header>

  <h1> ☆ DARBY JAHN ☆ </h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="print.html">Print</a>
    <a href="painting.html">Painting</a>
    <a href="media.html">Media</a>
  </nav>
</header>

<h2>Drag phone to ear to contact.</h2>

<div id="scene">

<svg aria-hidden="true">
  <path id="cord"></path>
</svg>

<img id="phone" src="media/phone.png" alt="Phone" draggable="false">
<img id="phonebase" src="media/phonebase.png" alt="Phone Base">

<img id="guy" src="media/guy.png" alt="">
<img id="guyarm" src="media/guyarm.png" alt="">
<div id="earAnchor"></div>

</div>

<script>
let grabbedByGuy = false;
let phoneRotation = 0;
const EAR_ROTATION = 10; // angle when on ear

// ===== SETTINGS =====
const SEGMENTS = 500;
const SEGMENT_LENGTH = 0.7;
const GRAVITY = 0.9;
const DAMPING = 0.97;
const STRAIGHT_SEGMENTS_BASE = 60;   // straight cord near phonebase.png

const TAIL_SEGMENTS = 10;     // straight section near phone
const TAIL_STIFFNESS = 0.20;  // smaller = more rigid

// coil
const COIL_RADIUS = 9;
const COILS = 45;
const DEPTH = 6;

// docking
const DOCK_RADIUS = 55;
const DOCK_LERP = 0.16;

// cord offsets
let BASE_CORD_OFFSET = { x: 0.45, y: 0.97 };
let PHONE_CORD_OFFSET_FRONT = { x: 0.45, y: 0.95 };
let PHONE_CORD_OFFSET_BACK  = { x: 0.45, y: 0.95 };

let SCALE = 1;

// ===== ELEMENT VARIABLES =====
let guy, guyarm, earAnchor, phone, phonebase, cord, scene;

// ===== STATE VARIABLES =====
let phonePos = { x: 0, y: 0 };
let phoneVel = { x: 0, y: 0 };
let isMouseDown = false;
let offset = { x:0, y:0 };
let docked = true;
let dockTarget = { x: phonePos.x, y: phonePos.y };
let dockingProgress = 0;

let points = [];
let prevPoints = [];

window.addEventListener("load", () => {

  // ===== ELEMENTS =====
  guy = document.getElementById("guy");
  guyarm = document.getElementById("guyarm");
  earAnchor = document.getElementById("earAnchor");
  phone = document.getElementById("phone");
  phonebase = document.getElementById("phonebase");
  cord = document.getElementById("cord");
  scene = document.getElementById("scene");

  // hide guy arm initially
  guyarm.style.display = "none";

  // start phone on base
  const baseRect = phonebase.getBoundingClientRect();
  phonePos.x = baseRect.left + baseRect.width/2 - phone.offsetWidth/2;
  phonePos.y = baseRect.top + baseRect.height/2 - phone.offsetHeight/2;
  phone.src = "media/phoneback.png";

  // initialize rope
  initRope();
  updateResponsiveScale(); // initial scaling

  // ===== DRAG EVENTS =====
  phone.addEventListener("mousedown", e=>{
    e.preventDefault();

    if(grabbedByGuy){
      grabbedByGuy = false;
      guyarm.style.display = "none";
    }

    isMouseDown = true;
    docked = false;
    dockingProgress = 0;
    phoneRotation = 0;
    phone.src = "media/phone.png";

    offset.x = e.clientX - phonePos.x;
    offset.y = e.clientY - phonePos.y;
  });

  window.addEventListener("mouseup", ()=>{
    isMouseDown = false;
  });

  window.addEventListener("mousemove", e=>{
    if(!isMouseDown) return;
    phonePos.x = e.clientX - offset.x;
    phonePos.y = e.clientY - offset.y;
    phoneVel.x = 0;
    phoneVel.y = 0;
  });

  // ===== START ANIMATION =====
  animate();
});

// ===== RESPONSIVE SCALE =====
function updateResponsiveScale(){
  const DESIGN_HEIGHT = 900;
  SCALE = Math.min(window.innerHeight / DESIGN_HEIGHT, 1);

  guy.style.height = (900 * SCALE) + "px";
  guyarm.style.height = (900 * SCALE) + "px";
  earAnchor.style.left = (200 * SCALE) + "px";
  earAnchor.style.top  = (385 * SCALE) + "px";
  phone.style.width = (240 * SCALE) + "px";
  phonebase.style.width = (250 * SCALE) + "px";

  const baseRect = phonebase.getBoundingClientRect();
  if(docked){
    dockTarget.x = baseRect.left + baseRect.width/2 - phone.offsetWidth/2;
    dockTarget.y = baseRect.top + baseRect.height/2 - phone.offsetHeight/2;
  }

  cord.setAttribute("stroke-width", 6 * SCALE);
  initRope();
}
window.addEventListener("resize", updateResponsiveScale);

// ===== ROPE INITIALIZATION =====
function initRope() {
  const baseRect = phonebase.getBoundingClientRect();
  const anchorX = baseRect.left + baseRect.width * BASE_CORD_OFFSET.x;
  const anchorY = baseRect.top + baseRect.height * BASE_CORD_OFFSET.y;

  points = [];
  prevPoints = [];
  for (let i=0;i<SEGMENTS;i++){
    const t = i/(SEGMENTS-1);
    const x = anchorX*(1-t) + (phonePos.x+phone.offsetWidth*PHONE_CORD_OFFSET_FRONT.x)*t;
    const y = anchorY*(1-t) + (phonePos.y+phone.offsetHeight*PHONE_CORD_OFFSET_FRONT.y)*t;
    points.push({x,y,z:0});
    prevPoints.push({x,y,z:0});
  }
}

// ===== PHYSICS =====
function updatePhysics() {
  const baseRect = phonebase.getBoundingClientRect();
  const anchor = {
    x: baseRect.left + baseRect.width*BASE_CORD_OFFSET.x,
    y: baseRect.top + baseRect.height*BASE_CORD_OFFSET.y
  };
  points[0].x = anchor.x;
  points[0].y = anchor.y;

  const phoneRect = phone.getBoundingClientRect();
  const baseCenterX = baseRect.left + baseRect.width/2;
  const baseCenterY = baseRect.top + baseRect.height/2;
  const phoneCenterX = phoneRect.left + phoneRect.width/2;
  const phoneCenterY = phoneRect.top + phoneRect.height/2;
  const dist = Math.hypot(phoneCenterX - baseCenterX, phoneCenterY - baseCenterY);

  // smooth dock
  const targetX = docked ? dockTarget.x : baseCenterX - phone.offsetWidth/2;
  const targetY = docked ? dockTarget.y : baseCenterY - phone.offsetHeight/2;
  phonePos.x += (targetX - phonePos.x) * 0.15;
  phonePos.y += (targetY - phonePos.y) * 0.15;
  phoneVel.x *= 0.3;
  phoneVel.y *= 0.3;

  if(!isMouseDown && !grabbedByGuy && dist < DOCK_RADIUS){
    dockingProgress = Math.min(1, dockingProgress + DOCK_LERP);
    if(dockingProgress > 0.98 && !docked){
      docked = true;
      phone.src = "media/phoneback.png";
    }
  }

  // normal motion
  if(!isMouseDown && !docked && !grabbedByGuy){
    phoneVel.y += GRAVITY;
    phoneVel.x *= DAMPING;
    phoneVel.y *= DAMPING;
    phonePos.x += phoneVel.x;
    phonePos.y += phoneVel.y;
    const FLOOR_Y = window.innerHeight - 50;
    if(phonePos.y > FLOOR_Y - phone.offsetHeight){
      phonePos.y = FLOOR_Y - phone.offsetHeight;
      phoneVel.y *= -0.25;
    }
  }

  // guy grab
  const earRect = earAnchor.getBoundingClientRect();
  const guyGrabX = earRect.left;
  const guyGrabY = earRect.top;
  const distGuy = Math.hypot(phoneCenterX - guyGrabX, phoneCenterY - guyGrabY);

  if(!grabbedByGuy && !docked && !isMouseDown && distGuy < 120){
    grabbedByGuy = true;
    isMouseDown = false;
    phoneVel.x = 0;
    phoneVel.y = 0;
    phonePos.x = guyGrabX - phone.offsetWidth/2;
    phonePos.y = guyGrabY - phone.offsetHeight/2;
    phoneRotation = EAR_ROTATION;
    guyarm.style.display = "block";
  }

  if(grabbedByGuy){
    phonePos.x = guyGrabX - phone.offsetWidth/2;
    phonePos.y = guyGrabY - phone.offsetHeight/2;
    const distAway = Math.hypot(phoneCenterX - guyGrabX, phoneCenterY - guyGrabY);
    if(distAway > 160){
      grabbedByGuy = false;
      guyarm.style.display = "none";
    }
  }

  // verlet integration
  const end = points.length-1;
  for(let i=1;i<end;i++){
    const p = points[i];
    const prev = prevPoints[i];
    const vx = (p.x-prev.x)*DAMPING;
    const vy = (p.y-prev.y)*DAMPING + GRAVITY;
    const vz = (p.z-prev.z)*DAMPING;
    prev.x=p.x; prev.y=p.y; prev.z=p.z;
    p.x += vx; p.y += vy; p.z += vz;
  }

  // constraints
  for(let k=0;k<1200;k++){
    points[0].x = anchor.x;
    points[0].y = anchor.y;
    const attachOffset = docked ? PHONE_CORD_OFFSET_BACK : PHONE_CORD_OFFSET_FRONT;
    points[end].x = phonePos.x + phone.offsetWidth * attachOffset.x;
    points[end].y = phonePos.y + phone.offsetHeight * attachOffset.y;

    for(let i=0;i<end;i++){
      const p1 = points[i];
      const p2 = points[i+1];
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const dz = p2.z - p1.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
      let targetLength = SEGMENT_LENGTH;
      let stiffness = 1;
      if(i > end - TAIL_SEGMENTS){ stiffness = TAIL_STIFFNESS; }
      const diff = (dist - targetLength) / dist;
      if(i !== 0){ p1.x += dx * 0.5 * diff * stiffness; p1.y += dy * 0.5 * diff * stiffness; p1.z += dz * 0.5 * diff * stiffness; }
      if(i+1 !== end){ p2.x -= dx * 0.5 * diff * stiffness; p2.y -= dy * 0.5 * diff * stiffness; p2.z -= dz * 0.5 * diff * stiffness; }
    }
  }
}

// ===== DRAW CORD =====
function drawCord() {
  let d = `M ${points[0].x} ${points[0].y}`;
  for(let i=1;i<points.length;i++){
    const p = points[i];
    const prev = points[i-1];
    if(i < STRAIGHT_SEGMENTS_BASE || i > points.length - TAIL_SEGMENTS){
      d += ` L ${p.x} ${p.y}`;
      continue;
    }
    const dx = p.x-prev.x;
    const dy = p.y-prev.y;
    const len = Math.hypot(dx,dy)||1;
    const nx = -dy/len;
    const ny = dx/len;
    const phase = (i/points.length)*COILS*Math.PI*2;
    const x = p.x + nx*Math.cos(phase)*COIL_RADIUS;
    const y = p.y + ny*Math.cos(phase)*COIL_RADIUS + Math.sin(phase)*DEPTH;
    d += ` L ${x} ${y}`;
  }
  cord.setAttribute("d", d);
}

// ===== UPDATE PHONE =====
function updatePhone() {
  phone.style.left = phonePos.x + 'px';
  phone.style.top = phonePos.y + 'px';
  phone.style.transform = `rotate(${phoneRotation}deg)`;
}

// ===== ANIMATION LOOP =====
function animate() {
  updatePhysics();
  drawCord();
  updatePhone();
  requestAnimationFrame(animate);
}
</script>
</body>
</html>
