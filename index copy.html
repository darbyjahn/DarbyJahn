<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darby Jahn</title>

<script src="galleries.js"></script>

<style>

/* =========================
BASE
========================= */

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:Helvetica Neue, Arial, sans-serif;
}

/* =========================
BACKGROUND
========================= */

body{
    background:#fff url("images/bg.png") center/cover no-repeat;
}

/* =========================
LEFT STACK
========================= */

.header-stack{
    position:absolute;
    top:10%;
    left:6%;
    display:flex;
    flex-direction:column;
    z-index:10;
}

.site-title{
    margin:0;
    font-size:1.6rem;
    letter-spacing:.15em;
    text-transform:uppercase;
}

.main-nav{
    margin-top:1.5rem;
    display:flex;
    flex-direction:column;
    gap:.8rem;
}

.main-nav button{
    background:none;
    border:none;
    text-align:left;
    font-size:.95rem;
    letter-spacing:.15em;
    cursor:pointer;
}

/* =========================
MAIN CONTENT AREA
========================= */

.side-panel{

    position:absolute;
    top:18%;
    left:28%;

    width:60%;
    height:75%;

    overflow-y:auto;

    padding:10px;
    box-sizing:border-box;
}

/* =========================
SUBFOLDER GRID (SMALL BOXES)
========================= */

.subgrid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
}

.subtile{

    border:1px solid #ddd;
    background:#fff;

    cursor:pointer;

    padding:8px;

    font-size:.75rem;
    text-transform:uppercase;

    transition:.2s;
}

.subtile:hover{
    transform:translateY(-2px);
}

/* =========================
IMAGE GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
}

.thumb{

    cursor:pointer;
    border:1px solid #eee;
    background:#fff;
}

.thumb img,
.thumb video{

    width:100%;
    height:110px;
    object-fit:cover;
    display:block;
}

/* =========================
LIGHTBOX
========================= */

.modal{
    position:fixed;
    inset:0;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.modal.hidden{ display:none; }

.modal img,
.modal video{
    max-width:92vw;
    max-height:92vh;
}

/* =========================
MOBILE
========================= */

@media(max-width:700px){

    .subgrid{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }
}

</style>
</head>

<body>

<!-- LIGHTBOX -->
<div id="modal" class="modal hidden">
    <img id="modalImg">
</div>

<div class="header-stack">

    <h1 class="site-title">Darby<br>Jahn</h1>

    <div class="main-nav">

        <button onclick="showSub('2d')">2D</button>
        <button onclick="showSub('3d')">3D</button>
        <button onclick="showSub('4d')">4D</button>

    </div>

</div>

<div id="sidePanel" class="side-panel"></div>

<script>

const panel = document.getElementById("sidePanel");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

let currentImages = [];
let currentIndex = 0;

/* =========================
LEVEL 1 → SUBFOLDERS
========================= */

function showSub(type){

    const items = galleries[type] || [];

    panel.innerHTML = `<div class="subgrid"></div>`;

    const grid = panel.querySelector(".subgrid");

    items.forEach((item, i) => {

        const div = document.createElement("div");
        div.className = "subtile";

        div.innerHTML = item.title || "folder";

        div.onclick = () => showGrid(item);

        grid.appendChild(div);
    });
}

/* =========================
LEVEL 2 → IMAGE GRID
========================= */

function showGrid(folder){

    panel.innerHTML = `<div class="grid"></div>`;

    const grid = panel.querySelector(".grid");

    folder.images.forEach((src, i) => {

        const div = document.createElement("div");
        div.className = "thumb";

        if(src.endsWith(".mp4")){
            div.innerHTML = `<video src="${src}"></video>`;
        } else {
            div.innerHTML = `<img src="${src}">`;
        }

        div.onclick = () => openLightbox(folder.images, i);

        grid.appendChild(div);
    });
}

/* =========================
LEVEL 3 → LIGHTBOX
========================= */

function openLightbox(arr, i){

    currentImages = arr;
    currentIndex = i;

    show();

    modal.classList.remove("hidden");
}

/* click closes */
modal.onclick = () => modal.classList.add("hidden");

/* ESC + arrows */
document.addEventListener("keydown", e => {

    if(modal.classList.contains("hidden")) return;

    if(e.key === "Escape") modal.classList.add("hidden");

    if(e.key === "ArrowRight"){
        currentIndex = (currentIndex + 1) % currentImages.length;
        show();
    }

    if(e.key === "ArrowLeft"){
        currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
        show();
    }
});

function show(){

    const src = currentImages[currentIndex];

    modalImg.style.display = "none";

    let vid = document.getElementById("vid");

    if(vid) vid.remove();

    if(src.endsWith(".mp4")){

        vid = document.createElement("video");
        vid.id = "vid";
        vid.src = src;
        vid.controls = true;
        vid.autoplay = true;

        modal.appendChild(vid);

    } else {
        modalImg.style.display = "block";
        modalImg.src = src;
    }
}

</script>

</body>
</html>
