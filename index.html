<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darby Jahn</title>

<script src="galleries.js"></script>

<style>

/* =========================
BASE
========================= */

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:Helvetica Neue, Arial, sans-serif;
}

/* =========================
BACKGROUND
========================= */

body{
    background:#fff url("media/bg.png") center/cover no-repeat;
}

/* =========================
LEFT STACK
========================= */

.header-stack{
    position:absolute;
    top:10%;
    left:6%;
    display:flex;
    flex-direction:column;
    z-index:10;
}

.site-title{
    margin:0;
    font-size:1.6rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:#B5522A;
}

.main-nav{
    margin-top:1.5rem;
    display:flex;
    flex-direction:column;
    gap:.8rem;
    
}

.main-nav button{
    background:none;
    border:none;
    text-align:left;
    font-size:.95rem;
    letter-spacing:.15em;
    cursor:pointer;
    color:#B5522A;
}

/* =========================
MAIN CONTENT AREA
========================= */

.side-panel{

    position:absolute;
    top:18%;
    left:28%;

    width:60%;
    height:75%;

    overflow-y:auto;

    padding:10px;
    box-sizing:border-box;
}

/* =========================
SUBFOLDER THUMBNAILS
========================= */

.subgrid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:40px 30px;
    align-items:start;
}

/* Individual folder */

.subtile{
    border:none;
    outline:none;
    background:transparent;
    padding:0;
    margin:0;

    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;

    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.08em;

    color:#B5522A;

    transition:transform .25s ease;
}

/* Thumbnail area */

.subtile-thumb{
    width:100%;
    height:150px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:transparent;

    border:none;
    outline:none;

    overflow:visible;
}

/* Actual transparent thumbnail */

.subtile-thumb img{
    max-width:100%;
    max-height:150px;

    width:auto;
    height:auto;

    display:block;

    object-fit:contain;

    background:transparent;

    border:none;
    outline:none;

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        filter .25s ease;
}

/* Hover animation */

.subtile:hover .subtile-thumb img{
    transform:
        translateY(-10px)
        rotate(-4deg)
        scale(1.08);
}

/* Folder title */

.subtile-title{
    margin-top:12px;

    text-align:center;

    transition:
        transform .25s ease,
        letter-spacing .25s ease;
}

.subtile:hover .subtile-title{
    transform:translateY(-2px);
    letter-spacing:.14em;
}


/* =========================
MOBILE SUBFOLDER GRID
========================= */

@media(max-width:700px){

    .subgrid{
        grid-template-columns:repeat(2,1fr);
        gap:30px 20px;
    }

    .subtile-thumb{
        height:120px;
    }

    .subtile-thumb img{
        max-height:120px;
    }
}

/* =========================
IMAGE GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
}

.thumb{

    cursor:pointer;
    border:none;
    background:transparent;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.thumb img,
.thumb video{

    width:100%;
    height:180px;
    object-fit:contain;
    display:block;
}

/* =========================
LIGHTBOX
========================= */

.modal{
    position:fixed;
    inset:0;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.modal.hidden{ display:none; }

.modal img,
.modal video{
    max-width:92vw;
    max-height:92vh;
}

/* =========================
CONTACT
========================= */

.contact-scene{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    z-index:5;
}

/* CONTACT CORD */

.contact-scene svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:8;
}

#cord{
    fill:none;
    stroke:#D30000;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* PHONE */

#phone{
    position:fixed;
    width:240px;
    cursor:grab;
    user-select:none;
    z-index:9;
    -webkit-user-drag:none;
    touch-action:none;
}

#phone:active{
    cursor:grabbing;
}

#phonebase{
    position:fixed;
    top:20px;
    right:20px;
    width:250px;
    z-index:7;
    pointer-events:none;
}

/* PERSON */

#guy{
    position:fixed;
    left:0;
    bottom:0;
    height:900px;
    z-index:1;
    pointer-events:none;
}

#guyarm{
    position:fixed;
    left:0;
    bottom:0;
    height:900px;
    z-index:10;
    pointer-events:none;
}

/* EAR */

#earAnchor{
    position:fixed;
    width:20px;
    height:20px;
    pointer-events:none;
}

/* CONTACT FORM */

.contact-form-container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:min(500px, 80%);
    z-index:20;
}

.contact-form{
    display:flex;
    flex-direction:column;
    gap:1rem;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:1rem;
    font-size:1rem;
    border:1px solid #999;
    background:rgba(255,255,255,.85);
    box-sizing:border-box;
}

.contact-form textarea{
    height:160px;
}

.contact-form button{
    padding:.5rem 1.4rem;
    border:1px solid #000;
    background:none;
    cursor:pointer;
    align-self:flex-end;
}

#sentCheck{
    display:none;
    margin-left:10px;
    
}

/* =========================
MOBILE
========================= */

@media(max-width:700px){

    .subgrid{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }
}

</style>
</head>

<script>

const panel = document.getElementById("sidePanel");

/* =========================
SUBFOLDERS
========================= */

function showSub(type){

    const items = galleries[type] || [];

    panel.innerHTML = `<div class="subgrid"></div>`;

    const grid = panel.querySelector(".subgrid");

    items.forEach((item) => {

        const div = document.createElement("div");

        div.className = "subtile";

        /*
         * The Python script now provides
         * the thumbnail directly as item.thumb
         */

        const thumbnail = item.thumb || "";


        div.innerHTML = `

            <div class="subtile-thumb">

                <img
                    src="${thumbnail}"
                    alt="${item.title || "folder"}"
                    draggable="false"
                >

            </div>

            <div class="subtile-title">
                ${item.title || "folder"}
            </div>

        `;


        /*
         * Clicking the thumbnail opens
         * the folder's artwork.
         */

        div.onclick = () => showGrid(item);


        grid.appendChild(div);
    });
}

/* =========================
LEVEL 2 → IMAGE GRID
========================= */

function showGrid(folder){

    panel.innerHTML = `<div class="grid"></div>`;

    const grid = panel.querySelector(".grid");

    folder.images.forEach((src, i) => {

        const div = document.createElement("div");
        div.className = "thumb";

        if(src.endsWith(".mp4")){
            div.innerHTML = `<video src="${src}"></video>`;
        } else {
            div.innerHTML = `<img src="${src}">`;
        }

        div.onclick = () => openLightbox(folder.images, i);

        grid.appendChild(div);
    });
}

/* =========================
Contact 
========================= */

function showContact(){

    panel.innerHTML = `

        <div class="contact-scene">

            <svg aria-hidden="true">
                <path id="cord"></path>
            </svg>

            <img id="phone"
                 src="media/phone.png"
                 alt="Phone"
                 draggable="false">

            <img id="phonebase"
                 src="media/phonebase.png"
                 alt="Phone Base">

            <img id="guy"
                 src="media/guy.png"
                 alt="">

            <img id="guyarm"
                 src="media/guyarm.png"
                 alt="">

            <div id="earAnchor"></div>

            <div class="contact-form-container">

                <form id="contactForm" class="contact-form">

                    <input
                        type="text"
                        name="name"
                        placeholder="Name"
                        required
                    >

                    <input
                        type="email"
                        name="email"
                        placeholder="Email address *"
                        required
                    >

                    <textarea
                        name="message"
                        placeholder="Your message"
                        required
                    ></textarea>

                    <button type="submit">Send</button>

                    <span id="sentCheck">
                        ✓ Message sent
                    </span>

                </form>

            </div>

        </div>
    `;

    const phone = document.getElementById("phone");
    const phonebase = document.getElementById("phonebase");
    const guy = document.getElementById("guy");

const contactForm = document.getElementById("contactForm");
const sentCheck = document.getElementById("sentCheck");

contactForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    const formData = new FormData(contactForm);

    try {

        const response = await fetch("send.php", {
            method: "POST",
            body: formData
        });

        const result = await response.text();

        if (response.ok) {

            sentCheck.style.display = "inline";
            sentCheck.textContent = "✓ Message sent";

            contactForm.reset();

            setTimeout(() => {
                sentCheck.style.display = "none";
            }, 3000);

        } else {

            sentCheck.style.display = "inline";
            sentCheck.style.color = "red";
            sentCheck.textContent = result || "Message did not send.";

        }

    } catch (error) {

        sentCheck.style.display = "inline";
        sentCheck.style.color = "red";
        sentCheck.textContent = "Message did not send. Please try again.";

        console.error(error);
    }

});

    Promise.all([
        new Promise(resolve => {
            if (phone.complete) resolve();
            else phone.onload = resolve;
        }),
        new Promise(resolve => {
            if (phonebase.complete) resolve();
            else phonebase.onload = resolve;
        }),
        new Promise(resolve => {
            if (guy.complete) resolve();
            else guy.onload = resolve;
        })
    ]).then(() => {
        initContact();
    });
}

function initContact(){

const scene = document.querySelector(".contact-scene");

    const contactBlock = document.querySelector(".contact-form-container");

    const guy = document.getElementById("guy");
    
    const guyarm = document.getElementById("guyarm");
    const earAnchor = document.getElementById("earAnchor");
    const phone = document.getElementById("phone");
    const phonebase = document.getElementById("phonebase");
    const cord = document.getElementById("cord");

    let grabbedByGuy = false;
    let phoneRotation = 0;

    const EAR_ROTATION = 10;

    let phonePos = { x: 0, y: 0 };
    let phoneVel = { x: 0, y: 0 };

    let isMouseDown = false;
    let pointerId = null;

    let offset = { x: 0, y: 0 };

    let docked = true;
    let dockingProgress = 0;

    const DOCK_RADIUS = 55;
    const DOCK_LERP = 0.16;

    const GRAVITY = 0.9;
    const DAMPING = 0.97;

   const SEGMENTS = 500;
const SEGMENT_LENGTH = 0.7;

const STRAIGHT_SEGMENTS_BASE = 60;

const TAIL_SEGMENTS = 10;
const TAIL_STIFFNESS = 0.2;

const COIL_RADIUS_BASE = 15;
const COILS = 50;
const DEPTH_BASE = 6;

const CORD_THINNESS = 0.7;

let COIL_RADIUS =
    COIL_RADIUS_BASE *
    CORD_THINNESS;

let DEPTH =
    DEPTH_BASE *
    CORD_THINNESS;

cord.setAttribute(
    "stroke-width",
    4 * CORD_THINNESS
);

let points = [];
let prevPoints = [];

    const BASE_CORD_OFFSET = {
        x: 0.45,
        y: 0.97
    };

    const PHONE_CORD_OFFSET = {
        x: 0.45,
        y: 0.95
    };


    /* =========================
       INITIAL SETUP
    ========================= */

    contactBlock.style.display = "none";
    guyarm.style.display = "none";

const baseRect = phonebase.getBoundingClientRect();

phonePos.x =
    baseRect.left +
    baseRect.width / 2 -
    phone.offsetWidth / 2;

phonePos.y =
    baseRect.top +
    baseRect.height / 2 -
    phone.offsetHeight / 2;

phone.src = "media/phoneback.png";

   

    /* =========================
       EAR POSITION
    ========================= */

function positionEar(){

    const guyRect =
        guy.getBoundingClientRect();

    earAnchor.style.left =
        (guyRect.left + 290) + "px";

    earAnchor.style.top =
        (guyRect.top + 430) + "px";
}


    positionEar();


    /* =========================
       ROPE
    ========================= */

    function initRope(){

        const baseRect =
            phonebase.getBoundingClientRect();

        const anchorX =
            baseRect.left +
            baseRect.width * BASE_CORD_OFFSET.x;

        const anchorY =
            baseRect.top +
            baseRect.height * BASE_CORD_OFFSET.y;

        points = [];
        prevPoints = [];

        for(let i = 0; i < SEGMENTS; i++){

            const t = i / (SEGMENTS - 1);

            const x =
                anchorX * (1 - t) +
                (phonePos.x +
                 phone.offsetWidth *
                 PHONE_CORD_OFFSET.x) * t;

            const y =
                anchorY * (1 - t) +
                (phonePos.y +
                 phone.offsetHeight *
                 PHONE_CORD_OFFSET.y) * t;

          points.push({
    x:x,
    y:y,
    z:0
});

prevPoints.push({
    x:x,
    y:y,
    z:0
});
        }
    }


    /* =========================
       DRAGGING
    ========================= */

    phone.addEventListener("pointerdown", function(e){

        e.preventDefault();

        pointerId = e.pointerId;

        phone.setPointerCapture(pointerId);

        isMouseDown = true;
        docked = false;
        dockingProgress = 0;

        grabbedByGuy = false;

        guyarm.style.display = "none";

        phoneRotation = 0;

        phone.src = "media/phone.png";

        offset.x =
            e.clientX - phonePos.x;

        offset.y =
            e.clientY - phonePos.y;

        document.body.style.overflow = "hidden";
    });


    phone.addEventListener("pointermove", function(e){

        if(
            !isMouseDown ||
            e.pointerId !== pointerId
        ) return;

        phonePos.x =
            e.clientX - offset.x;

        phonePos.y =
            e.clientY - offset.y;

        phoneVel.x = 0;
        phoneVel.y = 0;
    });


    phone.addEventListener("pointerup", endDrag);
    phone.addEventListener("pointercancel", endDrag);


    function endDrag(e){

        if(e.pointerId !== pointerId) return;

        isMouseDown = false;

        pointerId = null;

        document.body.style.overflow = "";
    }


    /* =========================
       PHYSICS
    ========================= */

    function updatePhysics(){

        positionEar();

        const baseRect =
            phonebase.getBoundingClientRect();

        const anchor = {

            x:
                baseRect.left +
                baseRect.width *
                BASE_CORD_OFFSET.x,

            y:
                baseRect.top +
                baseRect.height *
                BASE_CORD_OFFSET.y
        };


        points[0].x = anchor.x;
        points[0].y = anchor.y;


        const phoneRect =
            phone.getBoundingClientRect();

        const phoneCenter = {

            x:
                phoneRect.left +
                phoneRect.width / 2,

            y:
                phoneRect.top +
                phoneRect.height / 2
        };


        const baseCenter = {

            x:
                baseRect.left +
                baseRect.width / 2,

            y:
                baseRect.top +
                baseRect.height / 2
        };


        const distToBase =
            Math.hypot(
                phoneCenter.x - baseCenter.x,
                phoneCenter.y - baseCenter.y
            );


        /* =========================
           PHONE ON BASE
        ========================= */

        if(docked){

            phonePos.x =
                baseCenter.x -
                phone.offsetWidth / 2;

            phonePos.y =
                baseCenter.y -
                phone.offsetHeight / 2;

            phoneVel.x = 0;
            phoneVel.y = 0;

            phone.src =
                "media/phoneback.png";
        }


        /* =========================
           PHONE FALLING
        ========================= */

        else if(
            !isMouseDown &&
            !grabbedByGuy
        ){

            phoneVel.y += GRAVITY;

            phoneVel.x *= DAMPING;
            phoneVel.y *= DAMPING;

            phonePos.x += phoneVel.x;
            phonePos.y += phoneVel.y;


            const floorY =
                window.innerHeight - 50;


            if(
                phonePos.y >
                floorY - phone.offsetHeight
            ){

                phonePos.y =
                    floorY - phone.offsetHeight;

                phoneVel.y *= -0.25;
            }


            if(distToBase < DOCK_RADIUS){

                dockingProgress =
                    Math.min(
                        1,
                        dockingProgress +
                        DOCK_LERP
                    );

                if(dockingProgress > 0.98){

                    docked = true;
                }
            }
        }


        /* =========================
           CHECK EAR
        ========================= */

        const earRect =
            earAnchor.getBoundingClientRect();


        const earPoint = {

            x: earRect.left,

            y: earRect.top
        };


        const distToEar =
            Math.hypot(
                phoneCenter.x - earPoint.x,
                phoneCenter.y - earPoint.y
            );


        /* =========================
           PHONE REACHES EAR
        ========================= */

        if(
            !grabbedByGuy &&
            !docked &&
            distToEar < 120
        ){

            grabbedByGuy = true;

            phoneVel.x = 0;
            phoneVel.y = 0;

            phoneRotation =
                EAR_ROTATION;

            guyarm.style.display =
                "block";

            /* SHOW CONTACT FORM */

            contactBlock.style.display =
                "block";
        }


        /* =========================
           PHONE ATTACHED TO EAR
        ========================= */

        if(grabbedByGuy){

            if(distToEar <= 160){

                phonePos.x =
                    earPoint.x -
                    phone.offsetWidth / 2;

                phonePos.y =
                    earPoint.y -
                    phone.offsetHeight / 2;
            }

            else{

                grabbedByGuy = false;

                guyarm.style.display =
                    "none";

                docked = false;

                phoneRotation = 0;

                contactBlock.style.display =
                    "none";
            }
        }


        /* =========================
           ROPE PHYSICS
        ========================= */

        const end =
            points.length - 1;


        for(
            let i = 1;
            i < end;
            i++
        ){

            const p = points[i];
            const prev = prevPoints[i];

          const vx =
    (p.x - prev.x) *
    DAMPING;

const vy =
    (p.y - prev.y) *
    DAMPING +
    GRAVITY;

const vz =
    (p.z - prev.z) *
    DAMPING;

prev.x = p.x;
prev.y = p.y;
prev.z = p.z;

p.x += vx;
p.y += vy;
p.z += vz;
        }


     /* =========================
   	ROPE CONSTRAINTS
	========================= */

for(let k = 0; k < 1200; k++){

    points[0].x = anchor.x;
    points[0].y = anchor.y;

    const attachOffset =
        docked
        ? PHONE_CORD_OFFSET
        : PHONE_CORD_OFFSET;

    points[end].x =
        phonePos.x +
        phone.offsetWidth *
        attachOffset.x;

    points[end].y =
        phonePos.y +
        phone.offsetHeight *
        attachOffset.y;

    for(let i = 0; i < end; i++){

        const p1 = points[i];
        const p2 = points[i + 1];

        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const dz = p2.z - p1.z;

        const dist =
            Math.sqrt(
                dx * dx +
                dy * dy +
                dz * dz
            ) || 1;

        const stiffness =
            (i > end - TAIL_SEGMENTS)
            ? TAIL_STIFFNESS
            : 1;

        const diff =
            (dist - SEGMENT_LENGTH) / dist;

        if(i !== 0){

            p1.x +=
                dx * 0.5 *
                diff *
                stiffness;

            p1.y +=
                dy * 0.5 *
                diff *
                stiffness;

            p1.z +=
                dz * 0.5 *
                diff *
                stiffness;
        }

        if(i + 1 !== end){

            p2.x -=
                dx * 0.5 *
                diff *
                stiffness;

            p2.y -=
                dy * 0.5 *
                diff *
                stiffness;

            p2.z -=
                dz * 0.5 *
                diff *
                stiffness;
        }
    }
}
}


    /* =========================
       DRAW CORD
    ========================= */

 function drawCord(){

    let d =
        `M ${points[0].x} ${points[0].y}`;

    for(let i = 1; i < points.length; i++){

        const p = points[i];
        const prev = points[i - 1];

        /*
         * Keep the sections immediately attached
         * to the base and phone relatively straight.
         */

        if(
            i < STRAIGHT_SEGMENTS_BASE ||
            i > points.length - TAIL_SEGMENTS
        ){

            d +=
                ` L ${p.x} ${p.y}`;

            continue;
        }

        /*
         * Calculate the direction of the rope.
         */

        const dx =
            p.x - prev.x;

        const dy =
            p.y - prev.y;

        const len =
            Math.hypot(dx, dy) || 1;

        /*
         * Perpendicular direction.
         * This lets us push the line sideways
         * to create the telephone-cord coil.
         */

        const nx =
            -dy / len;

        const ny =
            dx / len;

        /*
         * Coil phase.
         */

        const phase =
            (i / points.length) *
            COILS *
            Math.PI *
            2;

        /*
         * Coil around the rope.
         */

        const x =
            p.x +
            nx *
            Math.cos(phase) *
            COIL_RADIUS;

        const y =
            p.y +
            ny *
            Math.cos(phase) *
            COIL_RADIUS +
            Math.sin(phase) *
            DEPTH;

        d +=
            ` L ${x} ${y}`;
    }

    cord.setAttribute("d", d);
}


    /* =========================
       UPDATE PHONE
    ========================= */

    function updatePhone(){

        phone.style.left =
            phonePos.x + "px";

        phone.style.top =
            phonePos.y + "px";

        phone.style.transform =
            `rotate(${phoneRotation}deg)`;
    }


    /* =========================
       ANIMATION
    ========================= */

    function animate(){

        updatePhysics();

        drawCord();

        updatePhone();

        requestAnimationFrame(
            animate
        );
    }


    initRope();

    animate();
}

/* =========================
LEVEL 3 → LIGHTBOX
========================= */

function openLightbox(arr, i){

    currentImages = arr;
    currentIndex = i;

    show();

    modal.classList.remove("hidden");
}

/* click closes */
modal.onclick = () => modal.classList.add("hidden");

/* ESC + arrows */
document.addEventListener("keydown", e => {

    if(modal.classList.contains("hidden")) return;

    if(e.key === "Escape") modal.classList.add("hidden");

    if(e.key === "ArrowRight"){
        currentIndex = (currentIndex + 1) % currentImages.length;
        show();
    }

    if(e.key === "ArrowLeft"){
        currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
        show();
    }
});

function show(){

    const src = currentImages[currentIndex];

    modalImg.style.display = "none";

    let vid = document.getElementById("vid");

    if(vid) vid.remove();

    if(src.endsWith(".mp4")){

        vid = document.createElement("video");
        vid.id = "vid";
        vid.src = src;
        vid.controls = true;
        vid.autoplay = true;

        modal.appendChild(vid);

    } else {
        modalImg.style.display = "block";
        modalImg.src = src;
    }
}
