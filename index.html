<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darby Jahn</title>

<script src="galleries.js"></script>

<style>

/* =========================
BASE
========================= */

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:Helvetica Neue, Arial, sans-serif;
}

/* =========================
BACKGROUND
========================= */

body{
    background:#fff url("images/bg.png") center/cover no-repeat;
}

/* =========================
LEFT STACK
========================= */

.header-stack{
    position:absolute;
    top:10%;
    left:6%;
    display:flex;
    flex-direction:column;
    z-index:10;
}

.site-title{
    margin:0;
    font-size:1.6rem;
    letter-spacing:.15em;
    text-transform:uppercase;
}

.main-nav{
    margin-top:1.5rem;
    display:flex;
    flex-direction:column;
    gap:.8rem;
}

.main-nav button{
    background:none;
    border:none;
    text-align:left;
    font-size:.95rem;
    letter-spacing:.15em;
    cursor:pointer;
}

/* =========================
MAIN CONTENT AREA
========================= */

.side-panel{

    position:absolute;
    top:18%;
    left:28%;

    width:60%;
    height:75%;

    overflow-y:auto;

    padding:10px;
    box-sizing:border-box;
}

/* =========================
SUBFOLDER GRID (SMALL BOXES)
========================= */

.subgrid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
}

.subtile{

    border:1px solid #ddd;
    background:#fff;

    cursor:pointer;

    padding:8px;

    font-size:.75rem;
    text-transform:uppercase;

    transition:.2s;
}

.subtile:hover{
    transform:translateY(-2px);
}

/* =========================
IMAGE GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
}

.thumb{

    cursor:pointer;
    border:1px solid #eee;
    background:#fff;
}

.thumb img,
.thumb video{

    width:100%;
    height:110px;
    object-fit:cover;
    display:block;
}

/* =========================
LIGHTBOX
========================= */

.modal{
    position:fixed;
    inset:0;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.modal.hidden{ display:none; }

.modal img,
.modal video{
    max-width:92vw;
    max-height:92vh;
}

/* =========================
CONTACT
========================= */

.contact-scene{
    position:relative;
    width:100%;
    height:100%;
    min-height:600px;
    overflow:hidden;
}

/* CONTACT CORD */

.contact-scene svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:8;
}

#cord{
    fill:none;
    stroke:#D30000;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* PHONE */

#phone{
    position:absolute;
    width:180px;
    cursor:grab;
    user-select:none;
    z-index:9;
    -webkit-user-drag:none;
    touch-action:none;
}

#phone:active{
    cursor:grabbing;
}

#phonebase{
    position:absolute;
    top:20px;
    right:20px;
    width:190px;
    z-index:7;
    pointer-events:none;
}

/* PERSON */

#guy{
    position:absolute;
    left:0;
    bottom:0;
    height:650px;
    z-index:1;
    pointer-events:none;
}

#guyarm{
    position:absolute;
    left:0;
    bottom:0;
    height:650px;
    z-index:10;
    pointer-events:none;
}

/* EAR */

#earAnchor{
    position:absolute;
    width:20px;
    height:20px;
    pointer-events:none;
}

/* CONTACT FORM */

.contact-form-container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    width:min(500px, 80%);
    z-index:20;
}

.contact-form{
    display:flex;
    flex-direction:column;
    gap:1rem;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:1rem;
    font-size:1rem;
    border:1px solid #999;
    background:rgba(255,255,255,.85);
    box-sizing:border-box;
}

.contact-form textarea{
    height:160px;
}

.contact-form button{
    padding:.5rem 1.4rem;
    border:1px solid #000;
    background:none;
    cursor:pointer;
    align-self:flex-end;
}

#sentCheck{
    display:none;
    margin-left:10px;
    color:green;
}

/* =========================
MOBILE
========================= */

@media(max-width:700px){

    .subgrid{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }
}

</style>
</head>

<body>

<!-- LIGHTBOX -->
<div id="modal" class="modal hidden">
    <img id="modalImg">
</div>

<div class="header-stack">

    <h1 class="site-title">Darby<br>Jahn</h1>

<div class="main-nav">

    <button onclick="showSub('2d')">2D</button>
    <button onclick="showSub('3d')">3D</button>
    <button onclick="showSub('4d')">4D</button>

    <button onclick="showContact()">CONTACT</button>
    <button onclick="showCV()">CV</button>
    <button onclick="showAbout()">ABOUT</button>

</div>

</div>

<div id="sidePanel" class="side-panel"></div>

<script>

const panel = document.getElementById("sidePanel");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

let currentImages = [];
let currentIndex = 0;

/* =========================
LEVEL 1 → SUBFOLDERS
========================= */

function showSub(type){

    const items = galleries[type] || [];

    panel.innerHTML = `<div class="subgrid"></div>`;

    const grid = panel.querySelector(".subgrid");

    items.forEach((item, i) => {

        const div = document.createElement("div");
        div.className = "subtile";

        div.innerHTML = item.title || "folder";

        div.onclick = () => showGrid(item);

        grid.appendChild(div);
    });
}

/* =========================
LEVEL 2 → IMAGE GRID
========================= */

function showGrid(folder){

    panel.innerHTML = `<div class="grid"></div>`;

    const grid = panel.querySelector(".grid");

    folder.images.forEach((src, i) => {

        const div = document.createElement("div");
        div.className = "thumb";

        if(src.endsWith(".mp4")){
            div.innerHTML = `<video src="${src}"></video>`;
        } else {
            div.innerHTML = `<img src="${src}">`;
        }

        div.onclick = () => openLightbox(folder.images, i);

        grid.appendChild(div);
    });
}

/* =========================
ABOUT
========================= */

function showAbout(){

    panel.innerHTML = `
        <div class="info-page">

            <h2>About</h2>

            <div class="about-content">

                <p>
                    Your about text goes here.
                </p>

                <p>
                    You can have multiple paragraphs here.
                </p>

            </div>

        </div>
    `;
}

/* =========================
CV
========================= */

function showCV(){

    panel.innerHTML = `
        <div class="info-page cv-page">

            <h2>CV</h2>

            <div class="cv-content">

                <h3>Education</h3>

                <p>
                    Your education information here.
                </p>

                <h3>Exhibitions</h3>

                <p>
                    Your exhibitions here.
                </p>

                <h3>Selected Experience</h3>

                <p>
                    Your experience here.
                </p>

            </div>

        </div>
    `;
}

/* =========================
Contact 
========================= */

function showContact(){

    panel.innerHTML = `

        <div class="contact-scene">

            <svg aria-hidden="true">
                <path id="cord"></path>
            </svg>

            <img id="phone"
                 src="media/phone.png"
                 alt="Phone"
                 draggable="false">

            <img id="phonebase"
                 src="media/phonebase.png"
                 alt="Phone Base">

            <img id="guy"
                 src="media/guy.png"
                 alt="">

            <img id="guyarm"
                 src="media/guyarm.png"
                 alt="">

            <div id="earAnchor"></div>

            <div class="contact-form-container">

                <form id="contactForm" class="contact-form">

                    <input
                        type="text"
                        name="name"
                        placeholder="Name"
                        required
                    >

                    <input
                        type="email"
                        name="email"
                        placeholder="Email address *"
                        required
                    >

                    <textarea
                        name="message"
                        placeholder="Your message"
                        required
                    ></textarea>

                    <button type="submit">Send</button>

                    <span id="sentCheck">
                        ✓ Message sent
                    </span>

                </form>

            </div>

        </div>
    `;

    initContact();
}


/* =========================
LEVEL 3 → LIGHTBOX
========================= */

function openLightbox(arr, i){

    currentImages = arr;
    currentIndex = i;

    show();

    modal.classList.remove("hidden");
}

/* click closes */
modal.onclick = () => modal.classList.add("hidden");

/* ESC + arrows */
document.addEventListener("keydown", e => {

    if(modal.classList.contains("hidden")) return;

    if(e.key === "Escape") modal.classList.add("hidden");

    if(e.key === "ArrowRight"){
        currentIndex = (currentIndex + 1) % currentImages.length;
        show();
    }

    if(e.key === "ArrowLeft"){
        currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
        show();
    }
});

function show(){

    const src = currentImages[currentIndex];

    modalImg.style.display = "none";

    let vid = document.getElementById("vid");

    if(vid) vid.remove();

    if(src.endsWith(".mp4")){

        vid = document.createElement("video");
        vid.id = "vid";
        vid.src = src;
        vid.controls = true;
        vid.autoplay = true;

        modal.appendChild(vid);

    } else {
        modalImg.style.display = "block";
        modalImg.src = src;
    }
}

</script>

</body>
</html>
